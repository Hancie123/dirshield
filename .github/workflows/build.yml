name: Build

# Version-based builds: the version in src-tauri/tauri.conf.json drives
# everything. Every push builds and uploads installers named with that
# version. A push to master with a NEW version (no tag v<version> yet) also
# creates the tag and a GitHub Release with the installers attached.
# To release: bump "version" in tauri.conf.json, package.json and
# src-tauri/Cargo.toml, then push.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        name: Read and check version
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          P=$(node -p "require('./package.json').version")
          C=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tauri.conf.json=$V package.json=$P Cargo.toml=$C"
          if [ "$V" != "$P" ] || [ "$V" != "$C" ]; then
            echo "::error::Versions differ: tauri.conf.json=$V, package.json=$P, Cargo.toml=$C. Set all three to the same version."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ] && ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "New version v$V: a release will be created."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$V already released (or not a push to master): build only."
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    name: Build v${{ needs.version.outputs.version }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app
        run: yarn tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: dirshield-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DirShield v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
