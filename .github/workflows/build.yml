name: Build

# Builds run ONLY for releases: `yarn release 1.2` (scripts/release.mjs) sets
# the version, commits, creates the tag v1.2.0 and pushes it. That tag push
# starts this workflow, which builds the installers and publishes the GitHub
# Release. Ordinary commits/pushes do not build anything.
# You can also start a build by hand from the Actions tab (workflow_dispatch);
# that only builds and uploads installers, it never creates a release.
#
# Secrets (repository settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Without them (e.g. pull requests from forks) installers are still built,
# just without updater signatures; a release requires them.
#
# Optional, for the Windows 11 top-level Explorer menu:
#   WINDOWS_CERTIFICATE                 base64 of a code-signing .pfx (public CA)
#   WINDOWS_CERTIFICATE_PASSWORD        its password
# With them, the installer also ships a signed sparse package that puts
# DirShield in the top-level menu. Without them the installer is the same as
# before: the menu is under "Show more options" on Windows 11.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A tag push is creating a release: let it finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: v
        name: Read and check version
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          P=$(node -p "require('./package.json').version")
          C=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tauri.conf.json=$V package.json=$P Cargo.toml=$C"
          if [ "$V" != "$P" ] || [ "$V" != "$C" ]; then
            echo "::error::Versions differ: tauri.conf.json=$V, package.json=$P, Cargo.toml=$C. Set all three to the same version."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$V" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version in the files (v$V)."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$V: a release will be created."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: build only, no release."
          fi

  lint:
    name: Lint (fmt, typecheck, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: yarn typecheck
        run: yarn typecheck

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (RustSec advisories)
        # Vulnerabilities fail the build; "unmaintained" notices (mostly the
        # GTK3 crates Tauri uses on Linux) are reported as warnings.
        run: cargo audit --file src-tauri/Cargo.lock

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            artifacts: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          # Experimental: Secure Lock works on Linux, Quick Lock does not
          # protect anything there. See "Linux (experimental)" in README.md.
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig

    name: Build v${{ needs.version.outputs.version }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # Per OS: most Windows code is behind cfg(windows).
      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      # Signed sparse package for the Windows 11 top-level Explorer menu
      # (scripts/build-sparse-package.ps1). Skipped without a certificate.
      - name: Windows 11 Explorer menu package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::notice::No code-signing certificate: building without the Windows 11 top-level menu (the classic menu is unaffected)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            ./scripts/build-sparse-package.ps1 -PfxPath $pfx -PfxPassword $env:WINDOWS_CERTIFICATE_PASSWORD
          } finally {
            Remove-Item $pfx -Force
          }
          "SPARSE_CONFIG=src-tauri/target/sparse/tauri.sparse.conf.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          # Adds the Windows 11 menu package when the step above built one.
          EXTRA=()
          if [ -n "${SPARSE_CONFIG:-}" ]; then EXTRA=(--config "$SPARSE_CONFIG"); fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            yarn tauri build --bundles ${{ matrix.bundles }} "${EXTRA[@]}"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; a release needs signed updater artifacts."
            exit 1
          else
            echo "::warning::No updater signing key available; building without updater signatures."
            yarn tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}' "${EXTRA[@]}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dirshield-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          # Errors only if nothing matches; .sig files are absent on unsigned (PR) builds.
          if-no-files-found: error

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, lint, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub Release
      id-token: write # sign the build-provenance attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Updater manifest (latest.json)
        run: node scripts/latest-json.mjs dist "${{ needs.version.outputs.version }}" "${{ github.repository }}" > dist/latest.json

      - name: Checksums (SHA256SUMS.txt)
        working-directory: dist
        run: |
          find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -printf '%P\n' | sort \
            | while read -r f; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: DirShield v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Installers sit in per-bundle subfolders (nsis/, deb/, appimage/).
          files: |
            dist/**/*.exe
            dist/**/*.exe.sig
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.AppImage.sig
            dist/latest.json
            dist/SHA256SUMS.txt
