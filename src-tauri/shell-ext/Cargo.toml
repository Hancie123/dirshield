[package]
name = "dirshield-shell"
version = "0.0.0"
description = "DirShield's Windows 11 File Explorer menu handler (IExplorerCommand), loaded by Explorer through a sparse MSIX package"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "dirshield_shell"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
