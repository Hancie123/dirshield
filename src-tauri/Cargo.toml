[package]
name = "dirshield"
version = "1.1.1"
description = "DirShield - Windows folder locker with Quick Lock and AES-256-GCM Secure Lock"
authors = ["Mero Vision Pvt. Ltd"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "dirshield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Storage
rusqlite = { version = "0.42", features = ["bundled", "backup"] }

# Cryptography (well-maintained RustCrypto / dalek crates - no hand-rolled primitives)
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
zxcvbn = "3"

# Filesystem
walkdir = "2"

# Non-poisoning locks: a panic in one command must not break every later one.
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Search",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    # Windows Hello (KeyCredentialManager)
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

# Crypto + hashing must be fast even in debug/test builds (400 GB workloads).
[profile.dev.package."*"]
opt-level = 3
